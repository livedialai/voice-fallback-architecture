####### OpenSIPS: Carrier-IN mit Fallback auf LiveKit Cloud #####################
# Platzhalter ersetzen: <CARRIER_IP_1/2>, <MEDIA_NODE_IP>, <CLOUD_SIP_HOST>,
#                      <CLOUD_EDGE_IP>, <DB_PASS>, optional <TEST_IP>
# Syntaxprüfung: opensips -C -f /etc/opensips/opensips.cfg     (muss 0 liefern)
# Deploy:        systemctl restart opensips
##################################################################################

####### Global Parameters #########
mpath="/usr/lib/x86_64-linux-gnu/opensips/modules/"
log_level=3
stderror_enabled=yes
syslog_enabled=yes
udp_workers=4

# Carrier (sipload registriert hierher) + Health-Checks
socket=udp:0.0.0.0:5070

####### Modules #########
loadmodule "proto_udp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "sipmsgops.so"
loadmodule "db_mysql.so"
loadmodule "mi_fifo.so"
loadmodule "uac_auth.so"
loadmodule "uac_registrant.so"

modparam("uac_registrant", "db_url", "mysql://opensips:<DB_PASS>@localhost/opensips")
modparam("mi_fifo", "fifo_name", "/run/opensips/opensips_fifo")

####### Routing Logic #########
route {
    # Carrier-Monitoring: OPTIONS von erlaubten Quellen mit 200 OK beantworten (sonst 403)
    # <TEST_IP> nur eintragen, wenn du selbst testen willst — danach wieder entfernen.
    if (is_method("OPTIONS")) {
        if ($si == "<CARRIER_IP_1>" || $si == "<CARRIER_IP_2>") {
            sl_send_reply(200, "OpenSIPS OK");
        } else {
            sl_send_reply(403, "Forbidden");
        }
        exit;
    }

    # Nur der Carrier darf eingehend rein
    if ($si != "<CARRIER_IP_1>" && $si != "<CARRIER_IP_2>") {
        xlog("L_WARN", "REJECT $rm from $si (kein Carrier)\n");
        sl_send_reply(403, "Forbidden");
        exit;
    }

    if (is_method("INVITE")) {
        xlog("L_INFO", "INVITE $fU -> $rU von $si | prio1 lokale SFU\n");
        # PRIO 1: lokaler SFU (SIP-Bridge des media-node)
        $du = "sip:<MEDIA_NODE_IP>:5070";
        # Failover scharf schalten — greift bei 408 (Timeout) und 5xx
        t_on_failure("sfu_down");
        if (!t_relay()) { t_reply(500, "Server Error"); }
        exit;
    }

    t_relay();
}

# PRIO 2: LiveKit Cloud — NUR wenn der lokale SFU 408/5xx liefert
# ACHTUNG: $ru UND $du setzen. Nur $du auf den Hostnamen => OpenSIPS bricht die
#          Branch still ab ("tm:update_uac_dst: no valid destination found"),
#          der Anrufer bekommt nur 503, es geht kein Paket zur Cloud.
failure_route[sfu_down] {
    if (t_check_status("408|5[0-9][0-9]")) {
        xlog("L_WARN", "lokale SFU antwortet $T_reply_code -> Fallback Cloud fuer $rU\n");
        $ru = "sip:" + $rU + "@<CLOUD_SIP_HOST>";     # Host im R-URI = Projekt-Zuordnung
        $du = "sip:<CLOUD_EDGE_IP>:5060";             # Versand an die Cloud-Edge-IP
        t_on_failure("all_down");
        if (!t_relay()) { t_reply(500, "Server Error"); }
        exit;
    }
}

# Wenn auch die Cloud scheitert: ehrlicher Fehler statt Stille
failure_route[all_down] {
    xlog("L_ERR", "Cloud-Fallback auch gescheitert: $T_reply_code\n");
    t_reply(503, "Service Unavailable");
}
