# LiveKit SFU (self-hosted) — media-node — Vorlage (Werte ersetzen)
# Ziel: /etc/livekit/config.yaml     Dienst: livekit (systemd)
port: 7880                 # WebSocket/API (Worker verbinden hierher)
rtc:
  tcp_port: 7881
  udp_port: 7882           # ICE/Medien (RTP)
  use_external_ip: true    # bei NAT/Cloud Pflicht, sonst keine Medienverbindung
keys:
  <LIVEKIT_API_KEY>: <LIVEKIT_API_SECRET>   # identisch in Worker + SIP-Bridge!
room:
  empty_timeout: 300       # leeren Raum nach 5 min schliessen
  departure_timeout: 20    # Teilnehmer ohne Signal nach 20 s als weg betrachten
logging:
  level: info

redis:
  address: 127.0.0.1:6379
  password: "<REDIS_PASS>" # nur bei Redis-Auth / mehreren Knoten noetig
